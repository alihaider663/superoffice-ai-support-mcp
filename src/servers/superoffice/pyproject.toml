[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so-mcp"
version = "0.1.0"
description = "SuperOffice Core CRM MCP Server"
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "platform-config",
    "platform-security",
    "platform-observability",
    "platform-http",
    "mcp>=1.3.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/so_mcp"]
