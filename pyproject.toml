[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superoffice-ai-platform"
version = "0.1.0"
description = "Enterprise SuperOffice AI Support MCP Platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "SuperOffice AI Platform Team" }
]
[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "src/gateway",
    "src/servers/superoffice",
    "src/servers/diagnostics",
    "src/servers/knowledge",
    "src/servers/infrastructure",
    "src/servers/investigation",
    "src/services/investigation",
    "src/shared/platform-core",
    "src/shared/platform-config",
    "src/shared/platform-security",
    "src/shared/platform-observability",
    "src/shared/platform-http",
    "src/shared/platform-investigation",
]

[tool.uv.sources]
platform-core = { workspace = true }
platform-config = { workspace = true }
platform-security = { workspace = true }
platform-observability = { workspace = true }
platform-http = { workspace = true }
platform-investigation = { workspace = true }
platform-investigation-service = { workspace = true }
investigation-mcp = { workspace = true }
so-mcp = { workspace = true }
diag-mcp = { workspace = true }
kb-mcp = { workspace = true }
infra-mcp = { workspace = true }
platform-gateway = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "respx>=0.22.0,<1.0.0",
    "ruff>=0.9.0,<1.0.0",
    "mypy>=1.14.0,<3.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented-out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.isort]
known-first-party = [
    "platform_core",
    "platform_config",
    "platform_security",
    "platform_observability",
    "platform_http",
    "platform_investigation",
    "platform_investigation_service",
    "platform_gateway",
    "so_mcp",
    "diag_mcp",
    "kb_mcp",
    "infra_mcp",
    "investigation_mcp",
]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
    "src/gateway/src",
    "src/servers/superoffice/src",
    "src/servers/diagnostics/src",
    "src/servers/knowledge/src",
    "src/servers/infrastructure/src",
    "src/servers/investigation/src",
    "src/services/investigation/src",
    "src/shared/platform-core/src",
    "src/shared/platform-config/src",
    "src/shared/platform-security/src",
    "src/shared/platform-observability/src",
    "src/shared/platform-http/src",
    "src/shared/platform-investigation/src",
]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (zero I/O)",
    "integration: Integration tests with mocked adapters",
    "contract: MCP protocol and tool contract tests",
    "security: Security and authorization policy tests",
]
