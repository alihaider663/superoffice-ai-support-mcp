[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-core"
version = "0.1.0"
description = "Platform core types, exceptions, and base primitives"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]
