# Alembic configuration for SuperOffice AI Knowledge Base Server

[alembic]
# Path to migration scripts (relative to this file)
script_location = %(here)s/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Version locations specification
version_locations = %(here)s/migrations/versions

# sys.path prepend to import project modules
prepend_sys_path = %(here)s/../../..

# Version path separator
version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
