name: Bug Report
description: Create a report to help us reproduce and fix an issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security Notice**: Do NOT report security vulnerabilities, credentials, tokens, or customer CRM data in public issues. Please review `SECURITY.md` in the root of the repository for responsible disclosure procedures.
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which platform component is affected?
      options:
        - Platform Gateway
        - SuperOffice MCP (so-mcp)
        - Diagnostics MCP (diag-mcp)
        - Knowledge MCP (kb-mcp)
        - Investigation MCP (investigation-mcp)
        - Security / RBAC
        - Ingestion Pipeline
        - Tooling / Scripts
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this behavior?
      placeholder: |
        1. Start server with '...'
        2. Call MCP tool '...' with arguments '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant log snippets or error tracebacks (scrub all tokens, passwords, and private identifiers before posting).
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, local dependencies.
      placeholder: Python 3.12.x on Windows 11 / Ubuntu 22.04
    validations:
      required: false
