[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-mcp"
version = "0.1.0"
description = "SuperOffice Knowledge Base and Runbook MCP Server"
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "platform-config",
    "platform-security",
    "platform-observability",
    "platform-investigation",
    "mcp>=1.3.0,<2.0.0",
    "supabase>=2.11.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]
