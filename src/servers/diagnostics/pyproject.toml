[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diag-mcp"
version = "0.1.0"
description = "SuperOffice Database and Log Diagnostics MCP Server"
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "platform-config",
    "platform-security",
    "platform-observability",
    "platform-investigation",
    "mcp>=1.3.0,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.38,<3.0.0",
    "aioodbc>=0.5.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diag_mcp"]
