[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-gateway"
version = "0.1.0"
description = "SuperOffice AI Platform MCP Security Perimeter Gateway"
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "platform-config",
    "platform-security",
    "platform-observability",
    "platform-http",
    "platform-investigation",
    "mcp>=1.3.0,<2.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "starlette>=0.45.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platform_gateway"]
