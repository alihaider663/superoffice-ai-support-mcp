[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investigation-mcp"
version = "0.1.0"
description = "Investigation Orchestration MCP Server"
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "platform-config",
    "platform-security",
    "platform-observability",
    "platform-http",
    "platform-investigation",
    "platform-investigation-service",
    "so-mcp",
    "diag-mcp",
    "mcp>=1.3.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/investigation_mcp"]
